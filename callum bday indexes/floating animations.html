<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Jubilee Celebration</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --navy: #0a192f;
            --navy-light: #112240;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --white: #e6f1ff;
            --glass: rgba(17, 34, 64, 0.75);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            scroll-behavior: smooth; 
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--navy); 
            color: var(--white); 
            overflow-x: hidden; 
            line-height: 1.6; 
        }
        
        h1, h2, h3, h4 { 
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
        }
        
        /* --- UTILITIES --- */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }
        
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent;
        }
        
        .btn {
            display: inline-block; 
            padding: 15px 35px; 
            background: transparent; 
            border: 1px solid var(--gold);
            color: var(--gold); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 0.9rem;
            transition: all 0.4s ease;
            cursor: pointer; 
            text-decoration: none; 
            margin-top: 20px;
        }
        
        .btn:hover { 
            background: var(--gold); 
            color: var(--navy); 
            box-shadow: 0 0 15px var(--gold); 
            transform: translateY(-3px);
        }

        /* --- FLOATING CARDS GALLERY --- */
        .floating-gallery {
            padding: 80px 0;
            background: radial-gradient(circle at center, #112240 0%, var(--navy) 70%);
            position: relative;
            overflow: hidden;
        }

        .floating-gallery::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="50" cy="50" r="1" fill="%23d4af37" opacity="0.05"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .floating-container {
            position: relative;
            width: 100%;
            height: 600px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .floating-card {
            position: absolute;
            width: 280px;
            height: 380px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--gold);
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), 
                        opacity 0.8s ease,
                        box-shadow 0.5s ease;
            transform-style: preserve-3d;
            cursor: pointer;
            opacity: 0;
        }

        .floating-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(10, 25, 47, 0.7) 100%);
            border-radius: 15px;
            transition: opacity 0.5s ease;
        }

        .floating-card:hover::before {
            opacity: 0.3;
        }

        .floating-card:hover {
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.4);
            z-index: 100;
        }

        .floating-card.active {
            opacity: 1;
            z-index: 10;
        }

        .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 0 0 15px 15px;
            transform: translateY(100%);
            transition: transform 0.5s ease;
        }

        .floating-card:hover .card-content {
            transform: translateY(0);
        }

        .card-content h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: var(--gold);
        }

        .card-content p {
            font-size: 0.8rem;
            color: var(--white);
            opacity: 0.8;
        }

        /* Floating animation keyframes */
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -15px) rotate(1deg); }
            50% { transform: translate(-5px, -25px) rotate(-1deg); }
            75% { transform: translate(-10px, -15px) rotate(1deg); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-15px, -10px) rotate(-1deg); }
            50% { transform: translate(5px, -20px) rotate(1deg); }
            75% { transform: translate(15px, -10px) rotate(-1deg); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(12px, -18px) rotate(2deg); }
            50% { transform: translate(-8px, -22px) rotate(-2deg); }
            75% { transform: translate(-12px, -18px) rotate(2deg); }
        }

        /* Gallery Controls */
        .gallery-nav {
            text-align: center;
            margin-top: 30px;
            position: relative;
            z-index: 20;
        }

        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: var(--gold);
            transform: scale(1.2);
        }

        /* --- MAP & LOCATION --- */
        .map-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin-top: 50px;
            border: 1px solid var(--gold);
        }

        .map-details {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--navy-light);
        }

        .map-frame {
            width: 100%;
            height: 400px;
            border: none;
        }
        
        /* Custom Map Filter for Dark Theme */
        .google-map {
            width: 100%;
            height: 100%;
            filter: grayscale(100%) invert(92%) sepia(10%) saturate(200%) hue-rotate(180deg) brightness(90%) contrast(95%);
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .floating-container {
                height: 500px;
            }
            
            .floating-card {
                width: 220px;
                height: 300px;
            }
            
            .map-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- FLOATING CARDS GALLERY -->
    <section class="floating-gallery">
        <div class="container">
            <div style="text-align: center; margin-bottom: 50px;" class="reveal">
                <h2 class="gold-text" style="font-size: 3rem;">Cherished Memories</h2>
                <p style="opacity: 0.7; margin-top: 10px;">A journey through golden moments</p>
            </div>

            <div class="floating-container" id="floatingContainer">
                <!-- Cards will be injected via JavaScript -->
            </div>

            <div class="gallery-nav reveal">
                <div class="nav-dots" id="navDots">
                    <!-- Dots will be injected via JavaScript -->
                </div>
                <button class="btn" onclick="shuffleGallery()">Shuffle Memories</button>
            </div>
        </div>
    </section>

    <!-- MAP & LOCATION SECTION -->
    <section class="container reveal" style="margin-bottom: 100px; margin-top: 50px;">
        <div class="map-section">
            <!-- Left: Details & Calendar Button -->
            <div class="map-details">
                <h2>The Venue</h2>
                <p style="margin-bottom: 20px;">Ocean Green Beach Resort<br>Prampram, Ghana</p>
                
                <p><i class="fas fa-clock" style="color: var(--gold);"></i> 3:30 PM — Wednesday, Nov 19th</p>
                <p style="margin-bottom: 30px;"><i class="fas fa-tshirt" style="color: var(--gold);"></i> Dress Code: White (Casual)</p>

                <!-- GOOGLE CALENDAR LINK GENERATOR -->
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Birthday+Celebration+for+[Name]&dates=20251119T153000/20251119T220000&details=Dress+Code:+White+Casual.+Venue:+Ocean+Green+Beach+Resort.&location=Ocean+Green+Beach+Resort,+Prampram,+Ghana&sf=true&output=xml" 
                   target="_blank" 
                   class="btn" 
                   style="text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <i class="far fa-calendar-plus"></i> Add to Google Calendar
                </a>
            </div>

            <!-- Right: Google Map Embed with Filters -->
            <div class="map-frame">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3970.505295433216!2d0.0886!3d5.7020!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1020790000000001%3A0x123456789abcdef!2sOcean%20Green%20Beach%20Resort!5e0!3m2!1sen!2sgh!4v1620000000000!5m2!1sen!2sgh" 
                    class="google-map" 
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script>
        // Gallery data
        const galleryImages = [
            { 
                src: "Photos/4c0701df-b756-42e1-a1d5-e4826b2990ab.jpg", 
                title: "Beautiful Moments", 
                date: "Memories",
                animation: "float1",
                position: { x: 10, y: 50, z: 0 }
            },
            { 
                src: "Photos/d32d070d-c18c-4f88-8fcb-de6c11171782.jpg", 
                title: "Special Times", 
                date: "Captured",
                animation: "float2",
                position: { x: 70, y: 20, z: 20 }
            },
            { 
                src: "Photos/PT7_3146.JPG", 
                title: "Celebrations", 
                date: "2024",
                animation: "float3",
                position: { x: 30, y: 10, z: 40 }
            },
            { 
                src: "Photos/b634976f-0aa1-4129-9946-50b7ed2d5882.jpg", 
                title: "Joyful Days", 
                date: "Memories",
                animation: "float1",
                position: { x: 80, y: 60, z: 10 }
            },
            { 
                src: "Photos/10410439-f590-4c00-9dd6-395bef2d2645.jpg", 
                title: "Cherished Moments", 
                date: "Special Day",
                animation: "float2",
                position: { x: 20, y: 70, z: 30 }
            },
            { 
                src: "Photos/PT7_3485.JPG", 
                title: "Happy Times", 
                date: "2024",
                animation: "float3",
                position: { x: 60, y: 30, z: 20 }
            },
            { 
                src: "Photos/IMG_4827.JPG", 
                title: "Elegant Evening", 
                date: "Gala",
                animation: "float1",
                position: { x: 40, y: 40, z: 10 }
            },
            { 
                src: "Photos/IMG-20200718-WA0015.jpg", 
                title: "Family Love", 
                date: "2020",
                animation: "float2",
                position: { x: 70, y: 50, z: 40 }
            }
        ];

        let currentSet = 0;
        const cardsPerSet = 5;
        const container = document.getElementById('floatingContainer');
        const navDots = document.getElementById('navDots');

        // Initialize gallery
        function initFloatingGallery() {
            createNavigationDots();
            showCardSet(currentSet);
            startFloatingAnimation();
        }

        // Create navigation dots
        function createNavigationDots() {
            const totalSets = Math.ceil(galleryImages.length / cardsPerSet);
            navDots.innerHTML = '';
            
            for (let i = 0; i < totalSets; i++) {
                const dot = document.createElement('div');
                dot.className = `nav-dot ${i === currentSet ? 'active' : ''}`;
                dot.addEventListener('click', () => showCardSet(i));
                navDots.appendChild(dot);
            }
        }

        // Show specific set of cards
        function showCardSet(setIndex) {
            // Update active dot
            document.querySelectorAll('.nav-dot').forEach((dot, index) => {
                dot.classList.toggle('active', index === setIndex);
            });
            
            // Calculate start and end indices
            const startIndex = setIndex * cardsPerSet;
            const endIndex = Math.min(startIndex + cardsPerSet, galleryImages.length);
            
            // Clear container
            container.innerHTML = '';
            
            // Add cards for current set
            for (let i = startIndex; i < endIndex; i++) {
                const img = galleryImages[i];
                const card = document.createElement('div');
                card.className = 'floating-card';
                card.style.backgroundImage = `url(${img.src})`;
                card.style.left = `${img.position.x}%`;
                card.style.top = `${img.position.y}%`;
                card.style.transform = `translateZ(${img.position.z}px)`;
                card.style.animation = `${img.animation} ${8 + i * 2}s ease-in-out infinite`;
                
                card.innerHTML = `
                    <div class="card-content">
                        <h3>${img.title}</h3>
                        <p>${img.date}</p>
                    </div>
                `;
                
                // Add click event to focus on card
                card.addEventListener('click', () => focusCard(card));
                
                container.appendChild(card);
                
                // Animate card entrance with delay
                setTimeout(() => {
                    card.classList.add('active');
                }, 200 * (i - startIndex));
            }
            
            currentSet = setIndex;
        }

        // Focus on a specific card (bring to front)
        function focusCard(card) {
            // Reset all cards
            document.querySelectorAll('.floating-card').forEach(c => {
                c.style.zIndex = '1';
                c.style.transform = c.style.transform.replace(/scale\([^)]*\)/, 'scale(1)');
            });
            
            // Bring clicked card to front
            card.style.zIndex = '100';
            card.style.transform = card.style.transform + ' scale(1.1)';
        }

        // Shuffle gallery (show random set)
        function shuffleGallery() {
            const totalSets = Math.ceil(galleryImages.length / cardsPerSet);
            const randomSet = Math.floor(Math.random() * totalSets);
            showCardSet(randomSet);
        }

        // Start floating animation
        function startFloatingAnimation() {
            // Animation is handled by CSS keyframes
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initFloatingGallery);

        // Scroll reveal animation
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 150;
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        // Initial check
        reveal();
    </script>
</body>
</html>
